[general]
import = [
 "~/.config/alacritty-theme.toml"
 # "~/.config/alacritty/themes/themes/github_dark_high_contrast.toml"
 # "~/.config/alacritty/themes/themes/github_light_high_contrast.toml"
]

live_config_reload = true 

[font]
size = 13.0

[font.bold]
#family = "monospace"
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.bold_italic]
#family = "monospace"
family = "FiraCode Nerd Font Mono"
style = "Bold Italic"

[font.italic]
#family = "monospace"
family = "FiraCode Nerd Font Mono"
style = "Italic"

[font.normal]
#family = "monospace"
family = "FiraCode Nerd Font Mono"
style = "Regular"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
